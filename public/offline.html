<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TripSplit</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f8f6;
        color: #202923;
        text-align: center;
        padding: 24px;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { color: #66716b; font-size: 14px; max-width: 340px; line-height: 1.5; margin: 0; }
      button {
        margin-top: 12px;
        background: #176b5b;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #125748; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>TripSplit needs a connection to show accurate balances. Your recorded data is safe on the server — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
